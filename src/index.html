<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>W&M</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fuente Inter (cargada desde CDN, no disponible en bundle) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tema de PrimeNG (el ThemeService usa este elemento por su id para cambiar modo oscuro/claro) -->
  <link id="app-theme" rel="stylesheet" href="assets/themes/lara-light-teal/theme.css">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1976d2">
  <meta name="description" content="W&M – Sistema de gestión comercial, logística y rastreo en tiempo real">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="W&M">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

  <!-- PDFMake (librería de PDF, no está en el bundle Angular) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js"></script>
</head>
<body>
  <app-root></app-root>
  <noscript>Por favor activa JavaScript para continuar usando esta aplicación.</noscript>
</body>
</html>
