<div class="min-h-screen flex surface-ground p-2 md:p-3 gap-2 md:gap-3 box-border">
  <!-- Desktop Sidebar -->
  <div class="hidden lg:flex flex-column w-16rem flex-shrink-0 surface-card border-round-3xl shadow-4 sticky z-5 premium-sidebar overflow-hidden" style="height: calc(100vh - 2rem); top: 1rem;">
    <div class="flex align-items-center justify-content-center h-5rem text-900 border-bottom-1 surface-border">
      <div class="flex align-items-center justify-content-center border-circle overflow-hidden p-1 mr-2 shadow-2" style="width: 36px; height: 36px; background-color: white !important;">
        <img src="assets/logo.jpg" alt="W&M Logo" style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      <span class="text-2xl font-bold tracking-wide">W&M</span>
    </div>
    <div class="flex-grow-1 overflow-y-auto py-3 px-3 flex flex-column gap-2 custom-scrollbar">
      <!-- Premium Custom Menu -->
      <a *ngFor="let item of menuItems()" 
         [routerLink]="item.routerLink" 
         routerLinkActive="active-menu-item" 
         [routerLinkActiveOptions]="{exact: item.routerLink === '/dashboard'}"
         class="menu-item-link flex align-items-center px-3 py-3 border-round-xl transition-all transition-duration-200 cursor-pointer text-decoration-none font-medium w-full">
        <i [class]="item.icon + ' text-xl menu-icon mr-3'"></i>
        <span class="text-base">{{ item.label }}</span>
      </a>
    </div>
    <div class="p-3 border-top-1 surface-border">
      <div class="text-sm text-500 text-center">W&M v2.2.0-build-4</div>
    </div>
  </div>

  <!-- Mobile Sidebar -->
  <p-sidebar [(visible)]="sidebarVisible" [fullScreen]="false" styleClass="w-16rem p-0">
    <ng-template pTemplate="header">
      <div class="flex align-items-center w-full">
        <div class="flex align-items-center justify-content-center border-circle overflow-hidden p-1 mr-2 shadow-1" style="width: 28px; height: 28px; background-color: white !important;">
            <img src="assets/logo.jpg" alt="W&M Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <span class="text-xl font-bold text-900">W&M</span>
      </div>
    </ng-template>
    <div class="px-3 pb-3 flex flex-column gap-2">
      <!-- Premium Custom Menu (Mobile) -->
      <a *ngFor="let item of menuItems()" 
         [routerLink]="item.routerLink" 
         routerLinkActive="active-menu-item" 
         [routerLinkActiveOptions]="{exact: item.routerLink === '/dashboard'}"
         (click)="sidebarVisible = false"
         class="menu-item-link flex align-items-center px-3 py-3 border-round-xl transition-all transition-duration-200 cursor-pointer text-decoration-none font-medium w-full">
        <i [class]="item.icon + ' text-xl menu-icon mr-3'"></i>
        <span class="text-base">{{ item.label }}</span>
      </a>
    </div>
  </p-sidebar>

  <!-- Main Content Area -->
  <div class="flex flex-column flex-grow-1 min-w-0">
    <!-- Topbar (Glassmorphism effect) -->
    <div class="topbar-glass h-5rem flex align-items-center justify-content-between px-4 sticky z-4 surface-card border-round-3xl shadow-4 mb-3" style="top: 1rem;">
      <div class="flex align-items-center">
        <!-- Mobile menu button -->
        <p-button icon="pi pi-bars" (click)="sidebarVisible = true" styleClass="p-button-text p-button-secondary p-button-rounded lg:hidden mr-2"></p-button>
        <div class="hidden sm:flex align-items-center gap-2">
            <p-avatar icon="pi pi-user" styleClass="bg-primary text-white" shape="circle"></p-avatar>
            <span class="font-medium text-700">Hola, <span class="font-bold text-900">{{ user()?.nombre_completo || user()?.correo }}</span></span>
        </div>
      </div>
      
      <div class="flex align-items-center gap-3">
        <span class="text-xs font-bold px-3 py-2 border-round-3xl bg-blue-50 text-blue-700 shadow-1">{{ primaryRole | uppercase }}</span>
        <p-button [icon]="themeService.isDarkMode ? 'pi pi-sun' : 'pi pi-moon'" styleClass="p-button-rounded p-button-text p-button-secondary shadow-1" (click)="themeService.toggleTheme()" pTooltip="Cambiar Tema"></p-button>
        <p-button icon="pi pi-sign-out" styleClass="p-button-rounded p-button-text p-button-danger shadow-1" (click)="logout()" pTooltip="Cerrar Sesión"></p-button>
      </div>
    </div>

    <!-- Content Router Outlet -->
    <div class="flex-grow-1 pb-4">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<!-- Chat Bot Global Flotante (Solo visible para Admin y Vendedor) -->
<app-chat-bot *ngIf="(user()?.rol | asArray).includes('admin') || (user()?.rol | asArray).includes('vendedor')"></app-chat-bot>
